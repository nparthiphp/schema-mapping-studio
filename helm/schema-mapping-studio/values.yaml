replicaCount: 2

image:
  repository: ghcr.io/your-org/schema-mapping-studio
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: nginx
  host: sms.example.com

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  ENV: production
  LOG_LEVEL: INFO
  PAYLOAD_MAX_BYTES: "51200"

secrets:
  apiKey: ""           # set via --set secrets.apiKey=...
  anthropicApiKey: ""  # set via --set secrets.anthropicApiKey=...

persistence:
  enabled: true
  storageClass: standard
  size: 1Gi

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
