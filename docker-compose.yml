version: "3.9"

services:
  schema-mapping-studio:
    build: .
    ports:
      - "8080:8080"
    environment:
      ENV: development
      API_KEY: ${API_KEY:-dev-secret-key}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DATABASE_URL: sqlite+aiosqlite:///./data/sms.db
      LOG_LEVEL: INFO
    volumes:
      - sms-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  sms-data:
